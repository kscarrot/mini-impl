<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP/2 SSE 测试</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 10px #0001;
        padding: 24px;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .status {
        margin: 16px 0;
        padding: 10px;
        border-radius: 4px;
        font-weight: bold;
      }
      .connected {
        background: #d4edda;
        color: #155724;
      }
      .disconnected {
        background: #f8d7da;
        color: #721c24;
      }
      .connecting {
        background: #fff3cd;
        color: #856404;
      }
      .controls {
        text-align: center;
        margin-bottom: 16px;
      }
      button {
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 18px;
        margin: 0 6px;
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
      .messages {
        height: 500px;
        overflow-y: auto;
        border: 1px solid #eee;
        background: #fafbfc;
        border-radius: 4px;
        padding: 10px;
      }
      .message {
        margin: 6px 0;
        padding: 8px;
        background: #fff;
        border-left: 4px solid #007bff;
        border-radius: 2px;
        font-size: 15px;
      }
      .timestamp {
        color: #888;
        font-size: 12px;
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>HTTP/2 SSE 测试</h1>
      <div id="status" class="status disconnected">未连接</div>
      <div class="controls">
        <button id="connectBtn" onclick="connectSSE()">连接 SSE</button>
        <button id="disconnectBtn" onclick="disconnectSSE()" disabled>断开连接</button>
        <button onclick="clearMessages()">清空消息</button>
      </div>
      <div class="messages" id="messages">
        <div class="message">等待连接...</div>
      </div>
    </div>
    <script>
      let eventSource = null
      function updateStatus(status, text) {
        const s = document.getElementById('status')
        s.className = 'status ' + status
        s.textContent = text
      }
      function addMessage(msg) {
        const messages = document.getElementById('messages')
        const div = document.createElement('div')
        div.className = 'message'
        const now = new Date()

        let displayContent
        if (typeof msg === 'string') {
          displayContent = msg
        } else if (msg.type === 'content') {
          displayContent = msg.msg
        } else {
          displayContent = JSON.stringify(msg)
        }

        div.innerHTML = `<span>${displayContent}</span><span class='timestamp'>${now.toLocaleTimeString()}</span>`
        messages.appendChild(div)
        messages.scrollTop = messages.scrollHeight
      }
      function connectSSE() {
        if (eventSource) return
        updateStatus('connecting', '正在连接...')
        eventSource = new EventSource('/api/sse')
        eventSource.onopen = function () {
          updateStatus('connected', '已连接')
          document.getElementById('connectBtn').disabled = true
          document.getElementById('disconnectBtn').disabled = false
          addMessage('SSE连接已建立')
        }
        eventSource.onmessage = function (e) {
          try {
            addMessage(JSON.parse(e.data))
          } catch {
            addMessage(e.data)
          }
        }
        eventSource.onerror = function () {
          updateStatus('disconnected', '连接断开')
          document.getElementById('connectBtn').disabled = false
          document.getElementById('disconnectBtn').disabled = true
          addMessage('SSE连接已断开')
          eventSource.close()
          eventSource = null
        }
      }
      function disconnectSSE() {
        if (eventSource) {
          eventSource.close()
          eventSource = null
          updateStatus('disconnected', '已断开连接')
          document.getElementById('connectBtn').disabled = false
          document.getElementById('disconnectBtn').disabled = true
          addMessage('SSE连接已断开')
        }
      }
      function clearMessages() {
        document.getElementById('messages').innerHTML = '<div class="message">等待连接...</div>'
      }
      window.addEventListener('beforeunload', function () {
        if (eventSource) eventSource.close()
      })
    </script>
  </body>
</html>
